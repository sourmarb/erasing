<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Интерактивное стирание</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#e9e9e7;font-family:Arial,sans-serif}
.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
.stage{
  position:relative;width:min(1100px,94vw);aspect-ratio:16/10;
  overflow:hidden;background:#f8f6ef;
  box-shadow:0 18px 50px rgba(0,0,0,.18);
  cursor:crosshair;touch-action:none;
}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.textInput{
  position:absolute;z-index:20;left:18px;top:18px;
  width:300px;min-height:42px;max-height:110px;resize:none;
  padding:10px 12px;border:1px solid rgba(60,55,48,.18);
  border-radius:10px;background:rgba(255,255,255,.9);
  color:#3b3833;font:500 14px/1.3 Arial,sans-serif;
  outline:none;box-shadow:0 4px 16px rgba(0,0,0,.08);
  pointer-events:auto;touch-action:auto;cursor:text;
}
.textInput:focus{background:#fff}
.hint{
  position:absolute;left:50%;bottom:20px;transform:translateX(-50%);
  z-index:20;padding:9px 14px;border-radius:20px;
  background:rgba(255,255,255,.78);color:#555;
  font:500 13px/1.2 Arial,sans-serif;pointer-events:none;
  white-space:nowrap;
}
button{
  position:absolute;right:18px;top:18px;z-index:20;
  border:0;border-radius:18px;padding:9px 14px;
  background:#222;color:#fff;font:500 13px Arial,sans-serif;
  cursor:pointer;pointer-events:auto;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage">
    <canvas id="paper"></canvas>
    <canvas id="text"></canvas>
    <canvas id="fx"></canvas>

    <textarea id="textInput" class="textInput"
      placeholder="введите текст.." spellcheck="false"
      aria-label="Текст для стирания"></textarea>

    <div class="hint" id="hint">Зажми левую кнопку мыши и стирай текст</div>
    <button id="reset" type="button">Начать заново</button>
  </div>
</div>

<script>
(function(){
"use strict";

const stage = document.getElementById("stage");
const input = document.getElementById("textInput");
const reset = document.getElementById("reset");
const hint = document.getElementById("hint");

const paper = document.getElementById("paper");
const text = document.getElementById("text");
const fx = document.getElementById("fx");

const p = paper.getContext("2d");
const t = text.getContext("2d");
const f = fx.getContext("2d");

let W=0, H=0, D=1;
let drawing=false, last=null;
let eraser={x:0,y:0};
let bits=[];
const zone={x:0,y:0,w:0,h:0};

function size(){
  const r=stage.getBoundingClientRect();
  W=r.width; H=r.height;
  D=Math.min(2,window.devicePixelRatio||1);

  [paper,text,fx].forEach(function(c){
    c.width=Math.round(W*D);
    c.height=Math.round(H*D);
    c.style.width=W+"px";
    c.style.height=H+"px";
  });
  [p,t,f].forEach(function(c){
    c.setTransform(D,0,0,D,0,0);
  });

  drawPaper();
  drawText();
}

function drawPaper(){
  p.clearRect(0,0,W,H);
  p.fillStyle="#f8f6ef";
  p.fillRect(0,0,W,H);

  const g=p.createRadialGradient(W*.5,H*.45,0,W*.5,H*.45,Math.max(W,H)*.75);
  g.addColorStop(0,"rgba(255,255,255,.45)");
  g.addColorStop(1,"rgba(190,184,170,.12)");
  p.fillStyle=g;
  p.fillRect(0,0,W,H);

  p.save();
  p.globalAlpha=.07;
  p.strokeStyle="#7d766c";
  p.lineWidth=.45;

  const fibers=Math.floor(W*H/1500);
  for(let i=0;i<fibers;i++){
    const x=Math.random()*W;
    const y=Math.random()*H;
    const len=2+Math.random()*8;
    const a=(Math.random()-.5)*.22;
    p.beginPath();
    p.moveTo(x,y);
    p.lineTo(x+Math.cos(a)*len,y+Math.sin(a)*len);
    p.stroke();
  }

  p.globalAlpha=.04;
  p.fillStyle="#5f594f";
  const dots=Math.floor(W*H/2300);
  for(let i=0;i<dots;i++){
    p.beginPath();
    p.arc(Math.random()*W,Math.random()*H,.2+Math.random()*.5,0,Math.PI*2);
    p.fill();
  }
  p.restore();
}

function drawText(){
  t.clearRect(0,0,W,H);

  const value=input.value.trim() || "введите текст..";
  const fs=Math.min(W*.072,70);

  t.font="500 "+fs+"px Arial,sans-serif";
  t.textBaseline="middle";

  const lines=value.split("\n");
  const gap=fs*1.18;
  const total=(lines.length-1)*gap;
  const start=H*.52-total/2;

  let max=0;

  lines.forEach(function(line,n){
    const cy=start+n*gap;
    const chars=[...line];
    const widths=chars.map(function(ch){return t.measureText(ch).width;});
    const tw=widths.reduce(function(a,b){return a+b;},0);
    max=Math.max(max,tw);

    let x=W/2-tw/2;

    chars.forEach(function(ch,i){
      const w=widths[i];

      t.save();
      t.translate(x+w/2,cy+(Math.random()-.5)*1.1);
      t.rotate((Math.random()-.5)*.016);

      t.globalAlpha=.8;
      t.fillStyle="#4a4742";
      t.fillText(ch,0,0);

      t.globalAlpha=.12;
      t.fillStyle="#25231f";
      for(let k=0;k<5;k++){
        t.fillRect(
          (Math.random()-.5)*Math.max(1,w*.9),
          (Math.random()-.5)*fs*.4,
          .4,.3
        );
      }
      t.restore();

      x+=w;
    });
  });

  zone.x=W/2-max/2-35;
  zone.y=start-fs*.65;
  zone.w=max+70;
  zone.h=Math.max(fs,lines.length*gap)+fs*.45;
}

function clearErase(){
  bits=[];
  drawing=false;
  last=null;
  hint.style.opacity="1";
}

function pos(e){
  const r=stage.getBoundingClientRect();
  return {x:e.clientX-r.left,y:e.clientY-r.top};
}

function erase(x,y,dx,dy){
  eraser.x=x;
  eraser.y=y;

  const a=-Math.PI/4 + Math.sin(performance.now()*.012)*.035;

  t.save();
  t.translate(x,y);
  t.rotate(a);
  t.globalCompositeOperation="destination-out";

  const g=t.createRadialGradient(0,-2,2,0,-22,27);
  g.addColorStop(0,"rgba(0,0,0,.99)");
  g.addColorStop(.7,"rgba(0,0,0,.86)");
  g.addColorStop(1,"rgba(0,0,0,0)");

  t.fillStyle=g;
  t.beginPath();
  t.ellipse(0,-18,19,46,0,0,Math.PI*2);
  t.fill();
  t.restore();

  if(
    x>zone.x && x<zone.x+zone.w &&
    y>zone.y && y<zone.y+zone.h &&
    Math.hypot(dx,dy)>.4 &&
    Math.random()<.36
  ){
    const n=Math.random()<.8?1:2;

    for(let i=0;i<n;i++){
      bits.push({
        x:x+(Math.random()-.5)*10,
        y:y+(Math.random()-.5)*10,
        vx:(Math.random()-.5)*.8,
        vy:(Math.random()-.5)*.55,
        a:Math.random()*Math.PI/2,
        s:Math.random()<.45 ? .2+Math.random()*.6 : .7+Math.random()*3.8,
        c:Math.random()<.75 ? "s" : "c"
      });
    }

    if(bits.length>150) bits.splice(0,bits.length-150);
  }

  hint.style.opacity="0";
}

function frame(){
  f.clearRect(0,0,W,H);

  bits.forEach(function(q){
    q.x+=q.vx;
    q.y+=q.vy;
    q.vx*=.78;
    q.vy*=.78;

    f.save();
    f.translate(q.x,q.y);
    f.rotate(q.a);
    f.globalAlpha=.84;
    f.fillStyle="#332f2a";

    if(q.c==="s"){
      f.strokeStyle="#332f2a";
      f.lineWidth=Math.max(.3,q.s*.16);
      f.beginPath();
      f.moveTo(-q.s*3,0);
      f.quadraticCurveTo(0,q.s*.3,q.s*3,0);
      f.stroke();
    }else{
      f.beginPath();
      f.roundRect(-q.s*.5,-q.s*.4,q.s,q.s*.8,q.s*.2);
      f.fill();
    }
    f.restore();
  });

  if(drawing){
    f.save();
    f.translate(eraser.x,eraser.y);
    f.rotate(-Math.PI/4 + Math.sin(performance.now()*.012)*.035);

    f.globalAlpha=.16;
    f.fillStyle="#111";
    f.filter="blur(5px)";
    f.beginPath();
    f.roundRect(-15,-76,30,76,7);
    f.fill();
    f.filter="none";

    f.globalAlpha=1;
    f.fillStyle="#111";
    f.beginPath();
    f.roundRect(-15,-76,30,76,7);
    f.fill();

    f.globalAlpha=.2;
    f.fillStyle="#fff";
    f.fillRect(-10,-62,3,28);
    f.restore();
  }

  requestAnimationFrame(frame);
}

stage.addEventListener("pointerdown",function(e){
  if(e.button!==0) return;
  if(e.target===input || e.target===reset) return;

  stage.setPointerCapture(e.pointerId);
  drawing=true;

  const q=pos(e);
  last=q;
  erase(q.x,q.y,0,1);
});

stage.addEventListener("pointermove",function(e){
  if(!drawing) return;
  if(e.target===input || e.target===reset) return;

  const q=pos(e);
  const dx=q.x-last.x;
  const dy=q.y-last.y;
  const d=Math.hypot(dx,dy);
  const n=Math.max(1,Math.ceil(d/6));

  for(let i=1;i<=n;i++){
    const z=i/n;
    erase(last.x+dx*z,last.y+dy*z,dx/n,dy/n);
  }

  last=q;
});

function stopDrawing(){
  drawing=false;
  last=null;
}
stage.addEventListener("pointerup",stopDrawing);
stage.addEventListener("pointercancel",stopDrawing);
stage.addEventListener("lostpointercapture",stopDrawing);

input.addEventListener("input",function(){
  clearErase();
  drawText();
});

input.addEventListener("pointerdown",function(e){
  e.stopPropagation();
});
input.addEventListener("pointermove",function(e){
  e.stopPropagation();
});

reset.addEventListener("click",function(e){
  e.preventDefault();
  clearErase();
  drawText();
});

window.addEventListener("resize",size);

size();
frame();

})();
</script>
</body>
</html>
